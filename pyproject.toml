[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mineimage"
version = "0.1.0"
description = "MineImage - 节点式图像处理实验工作台"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MineImage contributors" }]
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.scripts]
mineimage = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.operators" = ["builtin/*.py", "builtin/**/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
